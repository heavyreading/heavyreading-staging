<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Cerebrum — Swipe Factors</title>
<style>
  :root { --bg:#0f1115; --card:#1a1d24; --text:#e8eaed; --muted:#9aa0a6;
          --green:#34d399; --red:#f87171; --yellow:#fbbf24; --blue:#60a5fa; --border:#2d3139; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,sans-serif;
         height:100vh; height:100dvh; display:flex; flex-direction:column;
         -webkit-font-smoothing:antialiased; user-select:none; -webkit-user-select:none; overflow:hidden; }
  .topbar { padding:14px 16px 8px; text-align:center; flex-shrink:0; position:relative; }
  .topbar .count { font-size:13px; color:var(--muted); }
  .topbar .bar { height:4px; background:var(--border); border-radius:2px; margin-top:8px; overflow:hidden; }
  .topbar .fill { height:100%; background:var(--blue); border-radius:2px; transition:width .3s; }
  .deck { position:relative; flex:1; margin:12px 16px; min-height:200px; }
  .card { position:absolute; inset:0; background:var(--card); border:1px solid var(--border);
          border-radius:16px; padding:20px; display:flex; flex-direction:column; overflow-y:auto;
          transition:transform .25s ease, opacity .25s ease; box-shadow:0 8px 32px rgba(0,0,0,.4); }
  .card .grade-tag { font-size:11px; font-weight:700; color:var(--blue); text-transform:uppercase; letter-spacing:.5px; }
  .card h2 { font-size:20px; margin:6px 0 8px; }
  .card .desc { font-size:14px; color:var(--muted); line-height:1.5; }
  .card .stamp { position:absolute; top:16px; right:16px; font-size:24px; font-weight:800;
                 padding:4px 12px; border-radius:8px; opacity:0; transform:rotate(12deg); transition:opacity .15s; }
  .card .stamp.bull { color:var(--green); border:3px solid var(--green); }
  .card .stamp.bear { color:var(--red); border:3px solid var(--red); }
  .grade-pick { margin-top:12px; padding:12px; background:rgba(96,165,250,.06); border-radius:10px;
                border:1px dashed rgba(96,165,250,.3); }
  .grade-pick .lbl { font-size:12px; font-weight:700; color:var(--blue); margin-bottom:8px; }
  .grade-row { display:flex; gap:8px; }
  .gbtn { flex:1; padding:12px 4px; border-radius:8px; border:1px solid var(--border);
          background:transparent; color:var(--muted); font-size:14px; font-weight:700; cursor:pointer; }
  .gbtn.sel { border-color:var(--blue); color:var(--blue); background:rgba(96,165,250,.12); }
  .note-in { margin-top:10px; width:100%; padding:10px; border:1px solid var(--border); border-radius:8px;
             background:var(--bg); color:var(--text); font-size:14px; font-family:inherit; }
  .note-in::placeholder { color:var(--muted); }
  .yday { margin-top:10px; padding:10px; background:rgba(96,165,250,.06); border-radius:8px; font-size:13px; }
  .yday .ylbl { font-size:11px; font-weight:700; color:var(--blue); margin-bottom:4px; }
  .yday-btns { display:flex; gap:8px; margin-top:8px; }
  .yday-btns button { flex:1; padding:10px; border-radius:8px; font-weight:700; font-size:13px; cursor:pointer; }
  .yday-keep { border:none; background:var(--green); color:#06281c; }
  .yday-drop { border:1px solid var(--border); background:transparent; color:var(--muted); }
  .swipe-hint { text-align:center; color:var(--muted); font-size:13px; padding:0 16px 8px; flex-shrink:0; }
  .actions { display:flex; gap:12px; padding:0 16px 16px; padding-bottom:calc(16px + env(safe-area-inset-bottom)); flex-shrink:0; }
  .act { flex:1; padding:16px; border-radius:14px; border:2px solid var(--border);
         background:var(--card); font-size:28px; cursor:pointer; text-align:center; }
  .act:active { transform:scale(.94); }
  .fup-card { border-color:var(--yellow) !important; }
  .fup-card .grade-tag { color:var(--yellow); }
  .fup-q { font-size:17px; font-weight:600; margin:16px 0; line-height:1.4; }
  .fup-btns { display:flex; gap:8px; margin-top:12px; }
  .fup-btns button { padding:12px; border-radius:8px; font-weight:700; cursor:pointer; }
  .fup-skip { flex:1; border:1px solid var(--border); background:transparent; color:var(--muted); }
  .fup-next { flex:2; border:none; background:var(--blue); color:#fff; }
  .done { text-align:center; padding:40px 20px; }
  .done h2 { font-size:24px; margin-bottom:12px; }
  .done-item { text-align:left; font-size:13px; padding:10px; border-bottom:1px solid var(--border); }
  @keyframes pulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.04); } }
</style>
</head>
<body>

<div class="topbar">
  <div class="count" id="count">Loading…</div>
  <button onclick="showJournal()" style="position:absolute;top:14px;right:16px;background:none;border:1px solid var(--border);border-radius:8px;color:var(--muted);padding:6px 12px;font-size:12px;">📓 Journal</button>
  <div class="bar"><div class="fill" id="fill" style="width:0%"></div></div>
</div>
<div class="deck" id="deck"></div>
<div class="swipe-hint" id="hint">← bearish &nbsp;·&nbsp; tap card = skip &nbsp;·&nbsp; bullish →</div>
<div class="actions" id="actions">
  <button class="act" style="border-color:rgba(248,113,113,.4)" onclick="vote(-1)">🔴</button>
  <button class="act" style="border-color:rgba(251,191,36,.4);font-size:18px;font-weight:700;color:var(--yellow)" onclick="vote(0)">SKIP</button>
  <button class="act" style="border-color:rgba(52,211,153,.4)" onclick="vote(1)">🟢</button>
</div>

<script>
var factors = [
  { name:"Rumours & Chatter", grade:"WCS",
    desc:"What are you hearing that isn't on the wires? Upgrader issues? Unplanned outages? Who's talking?" },
  { name:"Trump Wildcard", grade:"WCS · SCO · Flat",
    desc:"Has Trump said or done anything in the last 24h that touches oil? Tariffs? SPR? Drill-baby-drill?" },
  { name:"China: What is Xi Doing?", grade:"WCS · SCO · Flat",
    desc:"Is Xi buying or selling? SPR fill? New quotas? Stimulus? Or is the data soft?" },
  { name:"Whale Stop Dynamics", grade:"WCS",
    desc:"Are stops piled up at an obvious level? Is someone big enough to gun for them? Thin market?" },
  { name:"Marginal Buyer / Seller", grade:"WCS",
    desc:"Who is FORCED to trade today? Refiners pre-turnaround? Month-end sellers? Who's stuck?" },
  { name:"Cash vs Screen", grade:"WCS · SCO",
    desc:"Is the cash market telling a different story than futures? Tight cash + weak screen (or vice versa)?" },
  { name:"What Changed Overnight?", grade:"ALL",
    desc:"Forget the model — what actually happened since yesterday that matters? News, moves, surprises?" }
];

var followUps = {
  "Rumours & Chatter": [
    "Are cash trades confirming this, or is it just talk?",
    "Who told you — trader, broker, or did you see it on screen?",
    "If true, how many barrels are we talking?"
  ],
  "Trump Wildcard": ["Is this priced in yet, or fresh?", "Which grade does it hit hardest?"],
  "China: What is Xi Doing?": ["SPR or commercial demand?", "How many barrels are we talking?"]
};

var idx = 0, results = [], selGrades = [], pendingFup = null;
var deck = document.getElementById('deck');

function dayKey(offset) {
  var d = new Date(); d.setDate(d.getDate() + (offset || 0));
  return d.toISOString().slice(0, 10);
}
function getY() {
  try {
    if (typeof localStorage === 'undefined') return {};
    var r = localStorage.getItem('tm_' + dayKey(-1));
    return r ? JSON.parse(r) : {};
  } catch (e) { return {}; }
}
function saveToday() {
  try {
    if (typeof localStorage === 'undefined') return;
    var o = {};
    results.forEach(function (r) { o[r.factor] = r; });
    localStorage.setItem('tm_' + dayKey(0), JSON.stringify(o));
  } catch (e) {}
}

function render() {
  try {
    _render();
  } catch (e) {
    document.getElementById('deck').innerHTML =
      '<div class="card"><h2>Error</h2><p style="color:var(--muted)">' + String(e.message || e) + '</p>'
      + '<button onclick="location.reload()" style="margin-top:16px;padding:12px;border-radius:8px;border:none;background:var(--blue);color:#fff;font-weight:700;">Reload</button></div>';
  }
}
function _render() {
  if (idx >= factors.length) { finish(); return; }
  var f = factors[idx], y = getY()[f.name];
  var yHtml = '';
  if (y) {
    var dirIcon = y.direction === 1 ? '🟢 Bullish' : y.direction === -1 ? '🔴 Bearish' : '🟡 Flat';
    yHtml = '<div class="yday"><div class="ylbl">YESTERDAY</div>'
      + '<div>' + dirIcon
      + (y.grades && y.grades.length ? ' <span style="color:var(--blue)">[' + y.grades.join(',') + ']</span>' : '')
      + '</div>'
      + (y.note ? '<div style="color:var(--muted);margin-top:4px">"' + esc(y.note) + '"</div>' : '')
      + '<div class="yday-btns">'
      + '<button class="yday-keep" onclick="keepY()">✓ Still valid</button>'
      + '<button class="yday-drop" onclick="dropY()">✕ Gone</button>'
      + '</div><div style="font-size:11px;color:var(--muted);margin-top:6px;text-align:center">Or swipe below to update</div></div>';
  }
  deck.innerHTML =
    '<div class="card" id="card">'
    + '<div class="stamp bull" id="stB">BULLISH</div><div class="stamp bear" id="stR">BEARISH</div>'
    + '<div class="grade-tag">' + f.grade + '</div><h2>' + f.name + '</h2>'
    + '<div class="desc">' + f.desc + '</div>'
    + '<div class="grade-pick" id="gpick"><div class="lbl">👆 TAP GRADE(S) FIRST, THEN SWIPE</div>'
    + '<div class="grade-row" id="grow">'
    + ['WCS','SCO','MSW','FLAT'].map(function (g) {
        return '<button class="gbtn" data-g="' + g + '" onclick="tg(this)">' + g + '</button>';
      }).join('')
    + '</div></div>'
    + '<input class="note-in" id="noteIn" placeholder="What? e.g. upgrader issues">'
    + yHtml
    + '</div>';
  document.getElementById('count').textContent = 'Factor ' + (idx + 1) + ' of ' + factors.length + ' · swipe or tap';
  document.getElementById('fill').style.width = (idx / factors.length * 100) + '%';
  selGrades = [];
  wireSwipe();
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

function tg(el) {
  el.classList.toggle('sel');
  var g = el.dataset.g;
  selGrades = el.classList.contains('sel')
    ? selGrades.concat([g]) : selGrades.filter(function (x) { return x !== g; });
}

function keepY() {
  var y = getY()[factors[idx].name];
  var r = Object.assign({}, y, { factor: factors[idx].name, carried: true });
  results.push(r);
  fly(0); setTimeout(next, 200);
}
function dropY() {
  var els = deck.querySelectorAll('.yday');
  els.forEach(function (e) { e.style.display = 'none'; });
}

function wireSwipe() {
  var card = document.getElementById('card');
  var sx = 0, dx = 0, on = false;
  card.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; on = true; }, { passive: true });
  card.addEventListener('touchmove', function (e) {
    if (!on) return;
    dx = e.touches[0].clientX - sx;
    card.style.transform = 'translateX(' + dx + 'px) rotate(' + (dx / 20) + 'deg)';
    document.getElementById('stB').style.opacity = dx > 60 ? 1 : 0;
    document.getElementById('stR').style.opacity = dx < -60 ? 1 : 0;
  }, { passive: true });
  card.addEventListener('touchend', function () {
    on = false;
    if (dx > 100) vote(1);
    else if (dx < -100) vote(-1);
    else { card.style.transform = ''; dx = 0;
           document.getElementById('stB').style.opacity = 0;
           document.getElementById('stR').style.opacity = 0; }
  });
  card.addEventListener('click', function (e) {
    if (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT') return;
    vote(0);
  });
}

function fly(dir) {
  var card = document.getElementById('card');
  if (!card) return;
  var x = dir === 1 ? 400 : dir === -1 ? -400 : 0;
  card.style.transform = 'translateX(' + x + 'px)';
  card.style.opacity = '0';
}

function vote(dir) {
  var noteEl = document.getElementById('noteIn');
  var note = noteEl ? noteEl.value : '';
  var fname = factors[idx].name;
  if (dir !== 0 && selGrades.length === 0) {
    var gp = document.getElementById('gpick');
    if (gp) { gp.style.animation = 'pulse 0.5s 2'; gp.style.border = '2px solid var(--yellow)'; }
  }
  var fups = followUps[fname];
  if (dir !== 0 && note && fups && fups.length) {
    pendingFup = { factor: fname, direction: dir, grades: selGrades.slice(), note: note, qi: 0, ans: [] };
    fly(dir);
    setTimeout(showFup, 220);
    return;
  }
  results.push({ factor: fname, direction: dir, grades: selGrades.slice(), note: note });
  fly(dir);
  setTimeout(next, 220);
}

function showFup() {
  var pf = pendingFup, qs = followUps[pf.factor], q = qs[pf.qi];
  document.getElementById('actions').style.display = 'none';
  document.getElementById('hint').style.display = 'none';
  deck.innerHTML =
    '<div class="card fup-card"><div class="grade-tag">FOLLOW-UP</div>'
    + '<h2 style="font-size:17px">"' + esc(pf.note) + '"</h2>'
    + '<div class="fup-q">' + q + '</div>'
    + '<input class="note-in" id="fupA" placeholder="Type answer...">'
    + '<div class="fup-btns"><button class="fup-skip" onclick="ansFup(\'\')">Skip</button>'
    + '<button class="fup-next" onclick="ansFup(document.getElementById(\'fupA\').value)">Next →</button></div>'
    + '<div style="font-size:12px;color:var(--muted);margin-top:8px">Question ' + (pf.qi + 1) + ' of ' + qs.length + '</div></div>';
  setTimeout(function () { var el = document.getElementById('fupA'); if (el) el.focus(); }, 300);
}

function ansFup(a) {
  var pf = pendingFup;
  if (a) pf.ans.push(a);
  pf.qi++;
  if (pf.qi < followUps[pf.factor].length) { showFup(); return; }
  results.push({ factor: pf.factor, direction: pf.direction, grades: pf.grades, note: pf.note, followUps: pf.ans });
  pendingFup = null;
  document.getElementById('actions').style.display = 'flex';
  document.getElementById('hint').style.display = 'block';
  next();
}

function next() { idx++; render(); }

function finish() {
  try { saveToday(); } catch (e) {}
  var bull = 0, bear = 0;
  try {
    bull = results.filter(function (r) { return r.direction === 1; }).length;
    bear = results.filter(function (r) { return r.direction === -1; }).length;
  } catch (e) {}
  var items = results.filter(function (r) { return r.direction !== 0; }).map(function (r) {
    return '<div class="done-item"><strong>' + (r.direction === 1 ? '🟢' : '🔴') + ' ' + r.factor + '</strong>'
      + (r.grades && r.grades.length ? ' <span style="color:var(--blue)">[' + r.grades.join(',') + ']</span>' : '')
      + (r.note ? '<br><span style="color:var(--muted)">"' + esc(r.note) + '"</span>' : '')
      + (r.followUps && r.followUps.length ? '<br><span style="color:var(--muted);font-size:12px">↳ ' + r.followUps.map(esc).join(' · ') + '</span>' : '')
      + (r.carried ? ' <span style="color:var(--green);font-size:11px">✓ carried</span>' : '')
      + '</div>';
  }).join('');
  deck.innerHTML = '<div class="done"><h2>Done ✓</h2>'
    + '<p style="color:var(--muted)">' + bull + ' bullish · ' + bear + ' bearish · '
    + (results.length - bull - bear) + ' skipped</p>' + items + '</div>';
  document.getElementById('actions').style.display = 'none';
  document.getElementById('hint').style.display = 'none';
  document.getElementById('count').textContent = 'Complete';
  document.getElementById('fill').style.width = '100%';
}

function showJournal() {
  var keys = [];
  for (var i = 0; i < localStorage.length; i++) {
    var k = localStorage.key(i);
    if (k.indexOf('tm_20') === 0) keys.push(k);
  }
  keys.sort().reverse();
  var html = '<div class="card"><div class="grade-tag">TRADING JOURNAL</div>'
    + '<h2>History</h2><div style="overflow-y:auto;flex:1">';
  if (!keys.length) html += '<p style="color:var(--muted)">No entries yet. Swipe some factors.</p>';
  keys.forEach(function (k) {
    var date = k.replace('tm_', '');
    var data;
    try { data = JSON.parse(localStorage.getItem(k)); } catch (e) { return; }
    html += '<div style="margin:12px 0;padding:12px;border:1px solid var(--border);border-radius:8px">'
      + '<div style="font-weight:700;margin-bottom:8px">' + date + '</div>';
    Object.keys(data).forEach(function (fname) {
      var r = data[fname];
      var icon = r.direction === 1 ? '🟢' : r.direction === -1 ? '🔴' : '🟡';
      html += '<div style="font-size:13px;padding:6px 0;border-bottom:1px solid var(--border)">'
        + icon + ' <strong>' + fname + '</strong>'
        + (r.grades && r.grades.length ? ' <span style="color:var(--blue)">[' + r.grades.join(',') + ']</span>' : '')
        + (r.note ? '<br><span style="color:var(--muted)">"' + esc(r.note) + '"</span>' : '')
        + (r.carried ? ' <span style="color:var(--green);font-size:11px">✓ carried</span>' : '')
        + '</div>';
    });
    html += '</div>';
  });
  html += '</div><button onclick="render();idx=Math.min(idx,factors.length-1);render();" '
    + 'style="margin-top:12px;padding:12px;border-radius:8px;border:1px solid var(--border);'
    + 'background:transparent;color:var(--text);font-weight:700;">← Back</button></div>';
  deck.innerHTML = html;
  document.getElementById('actions').style.display = 'none';
  document.getElementById('hint').style.display = 'none';
}

function showScores() {
  // Score past predictions against TMW moves
  // For now: client-side placeholder. Real scoring needs price history API.
  var keys = [];
  for (var i = 0; i < localStorage.length; i++) {
    var k = localStorage.key(i);
    if (k.indexOf('tm_20') === 0) keys.push(k);
  }
  keys.sort();
  var html = '<div class="card"><div class="grade-tag">SCORECARD</div>'
    + '<h2>Your Hit Rate</h2>'
    + '<div style="overflow-y:auto;flex:1">'
    + '<p style="color:var(--muted);font-size:14px;margin:12px 0">'
    + 'Scoring compares your directional calls against subsequent price moves. '
    + 'Wiring to TMW settlement history…</p>'
    + '<div style="padding:16px;text-align:center;color:var(--muted)">'
    + '📊 Coming soon: automatic scoring of<br>every prediction vs actual moves'
    + '</div></div>'
    + '<button onclick="showJournal()" '
    + 'style="margin-top:12px;padding:12px;border-radius:8px;border:1px solid var(--border);'
    + 'background:transparent;color:var(--text);font-weight:700;">← Journal</button></div>';
  deck.innerHTML = html;
}

// Add score button to journal view
render();
</script>
</body>
</html>
