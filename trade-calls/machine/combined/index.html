<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cerebrum — Combined Signal</title>
<style>
  :root { --bg:#0f1115; --card:#1a1d24; --text:#e8eaed; --muted:#9aa0a6;
          --green:#34d399; --red:#f87171; --yellow:#fbbf24; --blue:#60a5fa; --border:#2d3139; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,sans-serif;
         padding:16px; padding-bottom:40px; -webkit-font-smoothing:antialiased; }
  h1 { font-size:22px; margin-bottom:4px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:16px; }
  .net-card { background:var(--card); border:1px solid var(--border); border-radius:14px;
              padding:20px; text-align:center; margin-bottom:16px; }
  .net-card .lbl { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; }
  .net-card .score { font-size:42px; font-weight:800; margin:8px 0; }
  .net-card .verdict { font-size:16px; font-weight:700; }
  .grade-tabs { display:flex; gap:8px; margin-bottom:16px; }
  .gtab { flex:1; padding:10px; border-radius:10px; border:1px solid var(--border);
          background:transparent; color:var(--muted); font-weight:700; font-size:14px; cursor:pointer; text-align:center; }
  .gtab.active { border-color:var(--blue); color:var(--blue); background:rgba(96,165,250,.08); }
  .factor { background:var(--card); border:1px solid var(--border); border-radius:10px;
            padding:14px; margin-bottom:8px; border-left:3px solid var(--border); }
  .factor.bull { border-left-color:var(--green); }
  .factor.bear { border-left-color:var(--red); }
  .factor .top { display:flex; justify-content:space-between; align-items:center; }
  .factor .fname { font-weight:700; font-size:14px; }
  .factor .fscore { font-weight:800; font-size:16px; }
  .factor .src { font-size:11px; color:var(--muted); margin-top:4px; }
  .factor .why { font-size:13px; color:var(--muted); margin-top:6px; line-height:1.4; }
  .factor .note { font-size:13px; margin-top:4px; font-style:italic; }
  .section { font-size:13px; font-weight:700; color:var(--muted); text-transform:uppercase;
             letter-spacing:.5px; margin:20px 0 8px; }
  .pos { color:var(--green); } .neg { color:var(--red); } .flat { color:var(--yellow); }
  .back { display:inline-block; margin-bottom:16px; color:var(--blue); text-decoration:none; font-size:14px; }
</style>
</head>
<body>

<a href="index.html" class="back">← Cerebrum</a>
<h1>🧠 Combined Signal</h1>
<div class="sub" id="dateLine">Your judgments + machine data</div>

<div class="grade-tabs">
  <button class="gtab active" onclick="setGrade('WCS')">WCS</button>
  <button class="gtab" onclick="setGrade('SCO')">SCO</button>
  <button class="gtab" onclick="setGrade('ALL')">ALL</button>
</div>

<div class="net-card">
  <div class="lbl">Net Signal <span id="gradeLbl">WCS</span></div>
  <div class="score" id="netScore">–</div>
  <div class="verdict" id="verdict">–</div>
  <div class="sub" style="margin:8px 0 0" id="breakdown">–</div>
</div>

<div class="section">Ranked Factors</div>
<div id="factors"></div>

<div class="section">Threshold</div>
<div id="threshold" style="background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;font-size:14px;"></div>

<script>
// Automated scores (from scorer.py — in production this comes from API)
var autoScores = [
  { id:"curve_roll", name:"Curve Roll (Dec-Nov)", dir:1, imp:3,
    why:"Dec $0.81 wider than Nov, no fundamental driver. Roll-up candidate.",
    grades:["WCS"] },
  { id:"cracks", name:"Crack Spreads", dir:-1, imp:3,
    why:"3-2-1 crack $63.9, down $3.5 over 5 days. Refinery margins weakening.",
    grades:["WCS","SCO"] },
  { id:"seasonality", name:"Seasonality", dir:-1, imp:2,
    why:"October: fall turnaround season. Historically wide bias for WCS.",
    grades:["WCS"] },
  { id:"wcs_momentum", name:"WCS Momentum", dir:0, imp:1,
    why:"Nov TMW -$0.08 — noise.", grades:["WCS"] },
  { id:"inventories", name:"Inventories", dir:0, imp:1,
    why:"EIA +0.9 MMbbl WoW — noise.", grades:["WCS"] },
  { id:"wti_structure", name:"WTI Structure", dir:0, imp:1,
    why:"Flat.", grades:["FLAT"] },
  { id:"trump", name:"Trump Wildcard", dir:0, imp:2,
    why:"No oil-relevant Trump news in 24h.", grades:["WCS","SCO","FLAT"] },
  { id:"china", name:"China / Xi", dir:0, imp:3,
    why:"No SPR/quota signals.", grades:["WCS","SCO","FLAT"] },
  { id:"venezuela", name:"Venezuela", dir:0, imp:2,
    why:"No flow change detected.", grades:["WCS"] },
  { id:"opec", name:"OPEC+", dir:0, imp:1,
    why:"Indirect for WCS. Not overweighted.", grades:["FLAT"] },
];

var currentGrade = 'WCS';
var THRESHOLD = 10;

function getManual() {
  try {
    if (typeof localStorage === 'undefined') return [];
    var out = [];
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (k.indexOf('tm_20') !== 0) continue;
      var data = JSON.parse(localStorage.getItem(k));
      Object.keys(data).forEach(function (fname) {
        var r = data[fname];
        if (r.direction !== 0) out.push({
          name: r.factor + ' (you)',
          dir: r.direction, imp: 3,
          grades: r.grades && r.grades.length ? r.grades : ['WCS'],
          note: r.note, manual: true,
          date: k.replace('tm_','')
        });
      });
    }
    return out;
  } catch (e) { return []; }
}

function setGrade(g) {
  currentGrade = g;
  document.querySelectorAll('.gtab').forEach(function (b) {
    b.classList.toggle('active', b.textContent === g);
  });
  render();
}

function matchesGrade(f) {
  if (currentGrade === 'ALL') return true;
  return f.grades.indexOf(currentGrade) !== -1 || f.grades.indexOf('ALL') !== -1;
}

function render() {
  var manual = getManual();
  var all = autoScores.concat(manual).filter(matchesGrade);
  // Sort by absolute weighted score
  all.sort(function (a, b) {
    return Math.abs(b.dir * b.imp) - Math.abs(a.dir * a.imp);
  });
  var net = all.reduce(function (s, f) { return s + f.dir * f.imp; }, 0);

  var sc = document.getElementById('netScore');
  sc.textContent = (net >= 0 ? '+' : '') + net;
  sc.className = 'score ' + (net > 3 ? 'pos' : net < -3 ? 'neg' : 'flat');
  document.getElementById('gradeLbl').textContent = currentGrade;
  var v = document.getElementById('verdict');
  v.textContent = net > 3 ? 'Bullish ' + currentGrade : net < -3 ? 'Bearish ' + currentGrade : 'Neutral / Mixed';
  v.className = 'verdict ' + (net > 3 ? 'pos' : net < -3 ? 'neg' : 'flat');

  var nAuto = all.filter(function (f) { return !f.manual; }).length;
  var nMan = all.filter(function (f) { return f.manual; }).length;
  document.getElementById('breakdown').textContent =
    all.length + ' factors · ' + nAuto + ' machine · ' + nMan + ' your calls';
  document.getElementById('dateLine').textContent =
    new Date().toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' });

  var fh = all.map(function (f) {
    var w = f.dir * f.imp;
    var cls = f.dir > 0 ? 'bull' : f.dir < 0 ? 'bear' : '';
    var sc2 = f.dir > 0 ? 'pos' : f.dir < 0 ? 'neg' : 'flat';
    return '<div class="factor ' + cls + '"><div class="top">'
      + '<span class="fname">' + (f.dir > 0 ? '🟢 ' : f.dir < 0 ? '🔴 ' : '🟡 ') + f.name + '</span>'
      + '<span class="fscore ' + sc2 + '">' + (w >= 0 ? '+' : '') + w + '</span></div>'
      + '<div class="src">' + (f.manual ? '✋ YOUR CALL' + (f.date ? ' · ' + f.date : '') : '🤖 MACHINE')
      + ' · dir ' + (f.dir >= 0 ? '+' : '') + f.dir + ' × imp ' + f.imp
      + ' · ' + f.grades.join(', ') + '</div>'
      + (f.why ? '<div class="why">' + f.why + '</div>' : '')
      + (f.note ? '<div class="note">"' + f.note + '"</div>' : '')
      + '</div>';
  }).join('');
  document.getElementById('factors').innerHTML = fh || '<p style="color:var(--muted)">No factors for this grade.</p>';

  var th = document.getElementById('threshold');
  var anet = Math.abs(net);
  if (anet >= THRESHOLD) {
    th.innerHTML = '🎯 <strong>THRESHOLD CROSSED</strong> (' + anet + ' ≥ ' + THRESHOLD + ')<br>'
      + '<span style="color:var(--muted)">This meets your big-trade bar. '
      + '<a href="calls/index.html" style="color:var(--blue)">View suggested ticket →</a></span>';
    th.style.borderColor = 'var(--green)';
  } else {
    th.innerHTML = 'Net ' + (net >= 0 ? '+' : '') + net + ' vs threshold ±' + THRESHOLD + '<br>'
      + '<span style="color:var(--muted)">No high-conviction setup right now. '
      + (THRESHOLD - anet) + ' points away.</span>';
  }
}

render();
</script>
</body>
</html>
